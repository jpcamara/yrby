# fly.toml for the yrby site.
#
#   fly launch --no-deploy --copy-config
#   fly secrets set SECRET_KEY_BASE=$(openssl rand -hex 64)
#   fly deploy
#
# ONE machine, on purpose. Documents live in SQLite on the volume below, and a
# volume attaches to one machine — two machines would mean two databases and a
# visitor landing on whichever the proxy picked. This app scales up, not out.
# Scaling it out means moving the store to a shared database first.

app = "yrby-site"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Everything the container needs is baked into the Dockerfile's ENV. What is
# left here is the one secret and the one optional lock-down.
#
#   fly secrets set SECRET_KEY_BASE=$(openssl rand -hex 64)
#   fly secrets set ANYCABLE_SECRET=$(openssl rand -hex 32)
#
# ANYCABLE_SECRET configures both halves of AnyCable at once: the embedded Go
# server and Rails each derive the HTTP RPC key and the broadcast key from it.
[env]
  RAILS_ENV = "production"
  # Locks the WebSocket origin on BOTH halves of the cable from one value: the
  # entrypoint derives ANYCABLE_ALLOWED_ORIGINS for the embedded Go server by
  # stripping the scheme, and Rails re-checks on the Connect RPC. Set it once the
  # domain is settled; unset = permissive.
  # ALLOWED_ORIGINS = "https://yrby.dev"

[http_service]
  internal_port = 3000
  force_https = true

  # Scale to zero between visitors. The site is a demo, and most of the time
  # nobody is on it.
  #
  # With SQLite on the volume, a stopped machine no longer loses rooms: the
  # documents are on disk, and a returning visitor's link still works. What
  # empties a room now is the sweeper's TTL (24 hours idle), which is a content
  # decision, not a memory one. "suspend" keeps the memory image for a faster
  # resume. An open WebSocket counts as an active connection, so a machine with
  # people in a room is not stopped underneath them.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  # One machine, so the concurrency numbers are this box's ceiling, not a
  # load-balancing hint. 500 is MAX_CONNECTIONS from config/limits.rb; the app
  # refuses connections past it rather than degrading. The sockets are held by
  # the Go server inside thrust, not by Ruby.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/up"

# The SQLite database lives here; Fly creates the volume on first deploy
# (`fly volumes create yrby_site_data --size 1`). 1 GB fits the room cap with
# room to spare: 2000 documents x 512 KB is the configured ceiling.
[mounts]
  source = "yrby_site_data"
  destination = "/rails/storage"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  # RAM is no longer where documents live — idle rooms cost rows on the
  # volume, not memory. What remains resident is Rails plus the yrby native
  # extension (150-200 MB), the Go server's held sockets (5-10 MB at the
  # connection cap), and working memory for the CRDT applies and loads in
  # flight. 1 GB keeps comfortable headroom for those spikes.
