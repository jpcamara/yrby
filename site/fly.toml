# fly.toml for the yrby site.
#
#   fly launch --no-deploy --copy-config
#   fly secrets set SECRET_KEY_BASE=$(openssl rand -hex 64)
#   fly deploy
#
# ONE machine, on purpose. The document store is a Hash in the Puma worker's
# memory, and there is exactly one worker, so two machines would serve different
# rooms behind the same URL and a visitor would land on whichever the proxy
# picked. This app scales up, not out. Scaling it out means swapping the store
# for a shared one first.

app = "yrby-site"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Everything the container needs is baked into the Dockerfile's ENV. What is
# left here is the one secret and the one optional lock-down.
#
#   fly secrets set SECRET_KEY_BASE=$(openssl rand -hex 64)
#   fly secrets set ANYCABLE_SECRET=$(openssl rand -hex 32)
#
# ANYCABLE_SECRET configures both halves of AnyCable at once: the embedded Go
# server and Rails each derive the HTTP RPC key and the broadcast key from it.
[env]
  RAILS_ENV = "production"
  # Locks the cable handshake to this host once the domain is settled. The
  # check runs in the embedded Go server, not in Rails.
  # ANYCABLE_ALLOWED_ORIGINS = "yrby.dev"

[http_service]
  internal_port = 3000
  force_https = true

  # Scale to zero between visitors. The site is a demo, and most of the time
  # nobody is on it.
  #
  # The cost of this is in the store: rooms live in memory, so a machine that
  # stops loses every one of them. For ephemeral demo rooms that is fine —
  # they are dropped after 20 minutes idle anyway — but it has to be said out
  # loud, because it is the same property that makes this app unfit for
  # anything you would miss. A browser still holding the document re-seeds the
  # server on reconnect; a room whose tabs are all closed is gone.
  #
  # "suspend" keeps the machine's memory image, so a resumed machine still has
  # its rooms and starts in well under a second. Fly falls back to a full stop
  # when it can't suspend. Note that an open WebSocket counts as an active
  # connection, so a machine with people in a room is not stopped underneath
  # them.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  # One machine, so the concurrency numbers are this box's ceiling, not a
  # load-balancing hint. 500 is MAX_CONNECTIONS from config/limits.rb; the app
  # refuses connections past it rather than degrading. The sockets are held by
  # the Go server inside thrust, not by Puma.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/up"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  # 1 GB, not 512 MB: the store's own ceiling is 200 rooms x 512 KB (100 MB),
  # 500 held sockets in the Go server is roughly another 5-10 MB, and Rails plus
  # the yrby native extension is 150-200 MB resident. 512 MB would fit the
  # average case and fail at the caps, which is the wrong way round for limits
  # that exist to keep the process alive.
