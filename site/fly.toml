# fly.toml for the yrby site.
#
#   fly launch --no-deploy --copy-config
#   fly secrets set SECRET_KEY_BASE=$(openssl rand -hex 64)
#   fly deploy
#
# Run one machine. Documents live in SQLite on the volume below, and a volume
# attaches to one machine. Two machines would mean two databases, with each
# visitor landing on whichever one the proxy picked. To scale this app out,
# move the store to a shared database first.

app = "yrby-site"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# The Dockerfile's ENV lines set everything else the container needs. Set the
# two secrets with:
#
#   fly secrets set SECRET_KEY_BASE=$(openssl rand -hex 64)
#   fly secrets set ANYCABLE_SECRET=$(openssl rand -hex 32)
#
# The embedded Go server and Rails both derive the HTTP RPC key and the
# broadcast key from ANYCABLE_SECRET.
[env]
  RAILS_ENV = "production"
  # Required in production. The app won't boot without it (see
  # config/initializers/production_boot_checks.rb). This one value sets the
  # allowed WebSocket origins for both halves of the cable. The entrypoint
  # strips the scheme to build ANYCABLE_ALLOWED_ORIGINS for the embedded Go
  # server, and Rails checks the origin again on the Connect RPC. Set it to
  # this app's real origin.
  ALLOWED_ORIGINS = "https://yrby.dev"

[http_service]
  internal_port = 3000
  force_https = true

  # Scale to zero between visitors. The site is a demo, and most of the time
  # nobody is on it.
  #
  # The documents are in SQLite on the volume, so a stopped machine keeps its
  # rooms and a returning visitor's link still works. The sweeper deletes a
  # room after 24 hours idle, whether or not the machine stopped. "suspend"
  # keeps the memory image so the machine resumes faster. An open WebSocket
  # counts as an active connection, so Fly won't stop a machine while people
  # are in a room.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  # There's one machine, so these numbers are its ceiling. 500 is
  # MAX_CONNECTIONS from config/limits.rb, and the app refuses connections past
  # it. The Go server inside thrust holds the sockets.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/up"

# The SQLite database lives here. Fly creates the volume on the first deploy
# (`fly volumes create yrby_site_data --size 1` makes it by hand). 1 GB fits
# the room cap: 2000 documents x 512 KB is the configured ceiling.
[mounts]
  source = "yrby_site_data"
  destination = "/rails/storage"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  # Documents live on the volume, so idle rooms use disk and no memory. What
  # stays in memory is Rails plus the yrby native extension (150-200 MB), the
  # Go server's sockets (5-10 MB at the connection cap), and working memory for
  # CRDT loads and applies in progress. 1 GB leaves room for those spikes.
