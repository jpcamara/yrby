# Kamal config for deploying the same image to one cheap VPS.
#
#   gem install kamal
#   kamal setup     # first time: installs Docker on the host and boots the app
#   kamal deploy    # after that
#
# The alternative to fly.toml, not an addition to it. Pick one.
#
# ONE host and ONE container, on purpose. Documents live in SQLite on the
# volume below, so a second container would mean a second database and rooms
# split between them. This app scales up, not out.

service: yrby-site

image: jpcamara/yrby-site

servers:
  web:
    - 192.0.2.10 # replace with the VPS address

proxy:
  ssl: true
  host: yrby.example.com
  app_port: 3000
  healthcheck:
    path: /up
    interval: 10
  # kamal-proxy has to hold the WebSocket open. This is the setting to check
  # first if the cable connects and then dies after 30 seconds.
  response_timeout: 300

registry:
  username: jpcamara
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64 # most VPS hosts; drop to arch: arm64 for an Ampere/Graviton box

# Everything else the container needs is baked into the Dockerfile's ENV.
env:
  clear:
    RAILS_ENV: production
    # Locks the cable handshake to this host once the domain is settled. The
    # check runs in the embedded Go server, not in Rails.
    # ANYCABLE_ALLOWED_ORIGINS: yrby.example.com
  secret:
    - SECRET_KEY_BASE
    # Configures both halves of AnyCable at once: the embedded Go server and
    # Rails each derive the HTTP RPC key and the broadcast key from it.
    - ANYCABLE_SECRET

# The SQLite database lives on a named volume so documents survive deploys and
# restarts. Ephemerality comes from the sweeper's 24-hour TTL, not from losing
# the disk.
volumes:
  - "yrby_site_storage:/rails/storage"

# No accessories. That is the point of this app: no Postgres, no Redis, nothing
# to run alongside it. The WebSocket server is inside the same container, in the
# thrust proxy, and the database is a file on the volume above.

aliases:
  logs: app logs -f
  console: app exec --interactive --reuse "bin/rails console"
