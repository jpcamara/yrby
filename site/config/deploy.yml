# Kamal config for deploying the same image to one cheap VPS.
#
#   gem install kamal
#   kamal setup     # first time: installs Docker on the host and boots the app
#   kamal deploy    # after that
#
# The alternative to fly.toml, not an addition to it. Pick one.
#
# ONE host and ONE container, on purpose. The document store is a Hash in
# process memory and the cable adapter is `async`, so a second container would
# serve different rooms behind the same URL.

service: yrby-site

image: jpcamara/yrby-site

servers:
  web:
    - 192.0.2.10 # replace with the VPS address

proxy:
  ssl: true
  host: yrby.example.com
  app_port: 3000
  healthcheck:
    path: /up
    interval: 10
  # kamal-proxy buffers request bodies by default; a WebSocket is not a request
  # body. This is the setting to check first if the cable connects and then
  # dies at 30 seconds.
  response_timeout: 300

registry:
  username: jpcamara
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64 # most VPS hosts; drop to arch: arm64 for an Ampere/Graviton box

env:
  clear:
    RAILS_ENV: production
    PORT: 3000
    # Locks the cable handshake to this host once the domain is settled.
    # CABLE_ALLOWED_ORIGINS: https://yrby.example.com
  secret:
    - SECRET_KEY_BASE

# No accessories. That is the point of this app: no Postgres, no Redis, nothing
# to run alongside it.

aliases:
  logs: app logs -f
  console: app exec --interactive --reuse "bin/rails console"
