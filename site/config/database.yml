# SQLite, one file per environment under storage/. In the deployed container
# storage/ is a mounted volume, so documents survive restarts and deploys. The
# sweeper deletes rooms after they've been idle for a day.
#
# There's no pragma tuning. Rails 8's sqlite3 adapter defaults (WAL journal,
# NORMAL synchronous, busy timeout, mmap) suit a single-node app.
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

# Solid Queue's tables live in a second file, so polling for jobs doesn't
# share a write lock with the documents. Tests use Active Job's test adapter
# and don't have it.
development:
  primary:
    <<: *default
    database: storage/development.sqlite3
  queue:
    <<: *default
    database: storage/development_queue.sqlite3
    migrations_paths: db/queue_migrate

test:
  <<: *default
  database: storage/test.sqlite3

production:
  primary:
    <<: *default
    database: storage/production.sqlite3
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
