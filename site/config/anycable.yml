# The Rails half of AnyCable. The server half is anycable-go, embedded in the
# thrust proxy by the anycable-thruster gem, and configured through ANYCABLE_*
# environment variables (see the Dockerfile and fly.toml).
#
# One secret configures both halves. Ruby and Go each derive the HTTP RPC
# secret and the broadcast key from it, so there's no second variable to keep
# in sync.
default: &default
  # No Redis. There's one node, so Rails sends each broadcast straight to the
  # embedded Go server over localhost HTTP. The Go server listens for
  # broadcasts on its own port (8090 by default), separate from the port thrust
  # serves the site on.
  #
  # This is set here and not through ANYCABLE_HTTP_BROADCAST_URL, because both
  # halves read ANYCABLE_ variables. If that variable pointed at the site's
  # port, the Go server would bind its broadcast endpoint there and take the
  # port from the proxy.
  broadcast_adapter: http
  http_broadcast_url: <%= "http://localhost:#{ENV.fetch("ANYCABLE_HTTP_BROADCAST_PORT", "8090")}/_broadcast" %>

  # RPC over HTTP, mounted in this app, so there's no separate gRPC process.
  # The embedded Go server calls this path over localhost.
  # https://docs.anycable.io/anycable-go/rpc?id=rpc-over-http
  http_rpc: true
  http_rpc_mount_path: "/_anycable"

  # Development and test fall back to a committed, well-known value, which is
  # fine on a laptop. Production has to set its own.
  # config/initializers/production_boot_checks.rb stops the boot if the secret
  # is unset, the default, or too short, because /_anycable authenticates
  # callers with a bearer derived from it.
  secret: <%= ENV.fetch("ANYCABLE_SECRET", "yrby-site-development-secret") %>

  # The URL the browser uses is config.action_cable.url in
  # config/application.rb. thrust serves the pages and the cable on one port,
  # so there's no separate anycable-go on 8080.

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
  # No fallback in production. An unset ANYCABLE_SECRET stops the boot (see
  # production_boot_checks.rb).
  secret: <%= ENV.fetch("ANYCABLE_SECRET", nil) %>
