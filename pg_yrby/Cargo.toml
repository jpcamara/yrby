# Its own workspace: pgrx needs Postgres to build, so it stays out of the
# gem extension workspace at the repo root.
[workspace]

[package]
name = "pg_yrby"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg17"]
pg13 = ["pgrx/pg13", "pgrx-tests/pg13" ]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14" ]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15" ]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16" ]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17" ]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18" ]

pg_test = []
pg_bench = ["dep:pgrx-bench"]

[dependencies]
pgrx = "=0.19.3"
serde_json = "1"
yrs = "0.28.1"

[dependencies.pgrx-bench]
version = "=0.19.3"
optional = true

[dev-dependencies]
[dev-dependencies.pgrx-tests]
version = "=0.19.3"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
# The default debuginfo strip leaves a dylib that macOS dyld rejects
# ("mis-aligned LINKEDIT string pool") on this toolchain.
strip = false
