# Spike: yrby's binding over a C ABI, Marco Roth's pattern (oxc-ruby,
# lightningcss-ruby, rolldown-ruby, tsrs-ruby, yerba). A Rust staticlib with
# `extern "C"` functions and a cbindgen header, linked into a plain C extension
# (../yrby_c.c). No magnus, no rb-sys. See docs/no-magnus.md.
[workspace]

[package]
name = "yrby-ffi"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "yrby_ffi"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
yrs = { version = "0.28.1", features = ["sync"] }
serde_json = "1.0"

[build-dependencies]
cbindgen = { version = "0.29", default-features = false, optional = true }

[features]
# Regenerate ../include/yrby_ffi.h (checked in) with
# `cargo build --features header`. Off by default: a gem install doesn't
# need it, and it adds syn and friends to the clean build.
header = ["dep:cbindgen"]
