[package]
name = "yrby-core"
description = "yrby's Yjs sync and storage rules as plain functions: frame classification, causal readiness, gap-free encoding, compaction planning, and a transport-neutral document engine"
repository = "https://github.com/jpcamara/yrby"
readme = "README.md"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["JP Camara <johnpcamara@gmail.com>"]
license = "MIT"
keywords = ["yjs", "crdt", "yrs", "sync", "collaboration"]
categories = ["data-structures", "network-programming"]

[features]
# The document engine: grants, a store interface, and the sync loop, for a
# server to drive over any transport. The Ruby extension uses only the pure
# functions and leaves this off.
engine = ["dep:async-trait", "dep:base64", "dep:jsonwebtoken", "dep:serde", "dep:serde_json", "dep:tracing"]

[dependencies]
yrs = { version = "0.27", features = ["sync"] }
async-trait = { version = "0.1", optional = true }
base64 = { version = "0.23", optional = true }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true
